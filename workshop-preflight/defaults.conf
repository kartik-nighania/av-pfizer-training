# Workshop preflight defaults. Participants can accept or change these when the
# script starts. Edit here to pre-fill values for everyone before sending the kit.
# Never put API keys in this file: the script asks for them and hides the input.

OPENAI_BASE_URL=https://api.openai.com/v1
# Space separated. These are the workshop agent and judge models.
OPENAI_MODEL=gpt-4o-mini gpt-4.1-mini
LANGFUSE_HOST=https://cloud.langfuse.com
GIT_REPO_URL=https://github.com/kartik-nighania/av-pfizer-training
PIP_INDEX_URL=https://pypi.org/simple
# Matches requirements.txt in the workshop repo.
PIP_PACKAGES=langfuse==4.14.1 langchain==1.3.14 langgraph==1.2.9 langchain-openai==1.3.5 openai==2.46.0 pyyaml==6.0.3 deepeval==4.1.1 pandas matplotlib nest_asyncio requests
DOCKER_TEST_IMAGE=hello-world
DOCKER_BASE_IMAGE=python:3.12-slim

# auto = use the proxy from environment variables or system settings.
# none = connect directly. Otherwise a URL such as http://proxy.example.com:8080
PROXY_URL=auto

# Optional path to a corporate root CA bundle (PEM). Leave empty if not needed.
CA_BUNDLE=
